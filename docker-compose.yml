version: '3.9'

services:
  internal:
    image: dockerrepo.softdesign.dk:5000/fraud-${BRANCH_NAME}:latest
    command:  ["uvicorn", "fraud.internal_server:app", "--proxy-headers", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--log-level", "error"]

    networks:
      - synchronicer
      - redis-nw

    volumes:
      - fraud_data:/app/apps/fraud/data

    ports:
      - 6231:8000

    environment:
      - PYTHON_ENV=${PYTHON_ENV}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_JSON=true
      - TRAFIKVERKET_API_KEY=${TRAFIKVERKET_API_KEY}
      - BASE_FEATHER_URL=${BASE_FEATHER_URL:-/app/apps/fraud/data/SOSSV_fraud_csv5_new.parquet}
      - HMAC_SECRET=${HMAC_SECRET}

    logging:
      driver: syslog
      options:
        syslog-address: 'udp://logstash2:514'
        syslog-format: 'rfc3164'
        tag: 'fraud_internal'

    healthcheck:
      test: 'curl --fail http://localhost:8000/fraud/health || exit 1'
      interval: 60s
      retries: 5
      start_period: 5s
      timeout: 5s

    deploy:
      replicas: 2
      mode: replicated

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      update_config:
        parallelism: 1
        delay: 0s
        failure_action: pause
        monitor: 0s
        order: start-first
        max_failure_ratio: 0

  external:
    image: dockerrepo.softdesign.dk:5000/fraud-${BRANCH_NAME}:latest
    command:  ["uvicorn", "fraud.external_server:app", "--proxy-headers", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--log-level", "error"]

    networks:
      - synchronicer
      - redis-nw

    # volumes:
    #   - fraud_data:/app/apps/fraud/data

    ports:
      - 6232:8000

    environment:
      - PYTHON_ENV=${PYTHON_ENV}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_JSON=true
      - HMAC_SECRET=${HMAC_SECRET}

    logging:
      driver: syslog
      options:
        syslog-address: 'udp://logstash2:514'
        syslog-format: 'rfc3164'
        tag: 'fraud_external'

    healthcheck:
      test: 'curl --fail http://localhost:8000/fraud/health || exit 1'
      interval: 60s
      retries: 5
      start_period: 5s
      timeout: 5s

    deploy:
      replicas: 2
      mode: replicated

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      update_config:
        parallelism: 1
        delay: 0s
        failure_action: pause
        monitor: 0s
        order: start-first
        max_failure_ratio: 0


volumes:
  fraud_data:
    driver_opts:
      type: 'nfs'
      device: ':/volume1/${PYTHON_ENV}/fraud'
      o: 'addr=192.168.206.249,nfsvers=4'

networks:
  synchronicer:
    name: synchronicer
    external: true

  redis-nw:
    name: redis-nw
    external: true
