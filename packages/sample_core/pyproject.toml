[project]
name = "sample_core"
version = "0.1.0"
description = "Core features for the sample app"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = ["pydantic>=2.10.6"]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample_core"]
