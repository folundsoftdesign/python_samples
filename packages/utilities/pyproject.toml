[project]
name = "utilities"
version = "0.1.0"
description = "Fraud Detection utilities"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "cuid2>=2.0.1",
    "pydantic>=2.10.6",
    "requests>=2.32.3",
    "pandas>=2.2.3",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utilities"]
