[project]
name = "python_samples-monorepo"
version = "0.1.0"
description = "A Monorepo for all my Python projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "branca>=0.8.1",
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "geoviews>=1.14.0",
    "h3>=4.3.0",
    "holoviews>=1.21.0",
    "hvplot>=0.11.3",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jupyter-leaflet>=0.20.0",
    "mapclassify>=2.9.0",
    "matplotlib>=3.10.3",
    "movingpandas>=0.22.3",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "plotly>=6.2.0",
    "pyarrow>=21.0.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.1",
    "streamlit>=1.48.0",
    "streamlit-cookies-controller>=0.0.4",
    "streamlit-dynamic-filters>=0.1.9",
    "streamlit-folium>=0.25.1",
    "tabulate>=0.9.0",
]

[tool.uv.sources]
utilities = { workspace = true }
sample = { workspace = true }
sample_core = { workspace = true }
simple_storage = { workspace = true }
simple_worker = { workspace = true }


[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv]
dev-dependencies = [
    "pre-commit>=3.8.0",
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
    "ruff>=0.9.5",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.3",
    "mypy>=1.15.0",
    "mypy-extensions>=1.0.0",

    # These are added as dev dependencies becuase they should be available
    #  when developing the project.
    "utilities",
    "sample",
    "sample_core",
    "simple_storage",
    "simple_worker",
]
package = false
