[project]
name = "simple_worker"
version = "0.1.0"
description = "An implementation of a task handler using FastAPI, SQLLite and apscheulder"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "fastapi-pagination>=0.12.34",
    "fastapi[all]>=0.109.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.7.1",
    "python-json-logger>=3.2.1",
    "fastapi-problem>=0.10.6",
    "sqlmodel>=0.0.24",
    "anyio>=4.8.0",
    "apscheduler>=3.11.0",
    "pynvml>=12.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_worker"]

[dependency-groups]
dev = []
